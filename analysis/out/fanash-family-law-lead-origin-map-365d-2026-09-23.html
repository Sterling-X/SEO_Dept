<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Origins</title>
<style>
:root{
  --paper:#f3f2ec; --sheet:#fbfaf6; --ink:#1c2a39; --muted:#5d6a77; --hair:#d9d8cd;
  --county:#eef0e7; --countyline:#9aa38b; --countyoffice:#f2e7cd; --stateline:#3f4a58; --grat:#d6dbca;
  --lead:#848d7e; --leadline:#5c6356; --consult:#20507e; --gold:#a9822e; --office:#7d520c; --ttbg:#ffffff;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0e1319; --sheet:#131a22; --ink:#e6eaee; --muted:#94a1ae; --hair:#2a333e;
  --county:#1b2431; --countyline:#4a5a70; --countyoffice:#33291a; --stateline:#8794a6; --grat:#232f3f;
  --lead:#6d7568; --leadline:#9aa18f; --consult:#7db3ea; --gold:#d0aa56; --office:#e0bd72; --ttbg:#1b242e;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.sheet{max-width:1040px;margin:28px auto;background:var(--sheet);border:1px solid var(--hair);padding:34px 38px 30px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:fade .45s ease}}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.tblock{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:16px}
.eyebrow{font:600 10.5px var(--mono);letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin:0 0 8px}
h1{font:400 34px/1.05 var(--serif);margin:0;letter-spacing:.01em}
.sub{font:13px var(--sans);color:var(--muted);margin:8px 0 0;max-width:54ch}
.meta{font:11px var(--mono);text-align:right;color:var(--muted);min-width:228px}
.meta div{padding:3px 0;border-bottom:1px solid var(--hair)}
.meta div:last-child{border-bottom:none}
.meta b{color:var(--ink);font-weight:600;margin-left:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 26px;margin:18px 0 6px}
.kpi{border-top:1px solid var(--hair);padding-top:9px}
.kpi .lab{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font:500 26px var(--mono);margin-top:3px}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
.kpi .val.na{font-size:17px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:18px;font:12px var(--sans);color:var(--muted);margin:20px 0 4px;align-items:center}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:6px}
.sw-lead{background:var(--lead);opacity:.55;border:1px solid var(--leadline)}
.sw-con{background:var(--consult)}
.sw-off{width:10px;height:10px;border-radius:0;transform:rotate(45deg);background:transparent;border:1.6px solid var(--gold)}
.sw-cty{width:13px;height:9px;border-radius:0;background:var(--county);border:1px solid var(--countyline)}
#mapwrap{position:relative;margin:6px 0 4px}
#map{display:block;width:100%;height:auto;cursor:grab;touch-action:none}
#map.grabbing{cursor:grabbing}
#map:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.zoomctl{position:absolute;top:9px;left:9px;display:flex;gap:5px;align-items:center;
         background:color-mix(in srgb,var(--sheet) 88%,transparent);border:1px solid var(--hair);
         padding:4px 6px;font:11px var(--mono)}
.zoomctl button{all:unset;cursor:pointer;min-width:20px;height:20px;text-align:center;
         border:1px solid var(--hair);color:var(--ink);font:600 12px var(--mono);line-height:18px}
.zoomctl button:hover:not(:disabled){background:color-mix(in srgb,var(--gold) 18%,transparent)}
.zoomctl button:focus-visible{outline:1px solid var(--gold);outline-offset:1px}
.zoomctl button:disabled{opacity:.35;cursor:default}
.zoomctl button.wide{min-width:auto;padding:0 7px;font-weight:400}
.zoomctl #zlevel{color:var(--muted);min-width:34px;text-align:right}
.maphint{font:11px var(--sans);color:var(--muted);margin:2px 0 0;display:flex;
         justify-content:space-between;gap:14px;flex-wrap:wrap}
tr.clickable{cursor:pointer}
.county{fill:var(--county);stroke:var(--countyline);stroke-width:.85;stroke-linejoin:round}
.county-off{fill:var(--countyoffice)}
.grat{fill:none;stroke:var(--grat);stroke-width:.6;stroke-dasharray:2 3}
.state{fill:none;stroke:var(--stateline);stroke-width:1.7;stroke-linejoin:round}
.oc{fill:var(--lead);fill-opacity:.5;stroke:var(--leadline);stroke-width:.9}
.oc-k{fill-opacity:.24;stroke-dasharray:3 2}
.ic{fill:var(--consult);fill-opacity:1;stroke:var(--sheet);stroke-width:.9;pointer-events:none}
.hi{color:var(--consult);font-weight:600}
.kpi .val.hi{color:var(--consult)}
.legend label.tg{display:inline-flex;align-items:center;gap:7px;cursor:pointer;padding:3px 10px 3px 6px;
  border:1px solid var(--hair);border-radius:999px;user-select:none;color:var(--ink)}
.legend label.tg.off{opacity:.5}
.legend label.tg input{appearance:none;-webkit-appearance:none;width:26px;height:14px;border-radius:999px;
  background:var(--hair);position:relative;margin:0;cursor:pointer;transition:background .15s}
.legend label.tg input::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;
  background:var(--sheet);transition:left .15s}
.legend label.tg input:checked{background:var(--ink)}
.legend label.tg input:checked::after{left:14px}
.legend label.tg input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.legend .tghint{font-size:11px}
.ic.solo{fill-opacity:.82;stroke-width:1}
#tbl.nohire th:nth-child(4),#tbl.nohire td:nth-child(4),#tbl.nohire th:nth-child(5),#tbl.nohire td:nth-child(5){display:none}
.pt{cursor:default}
.pt:hover .oc,.pt:focus .oc{stroke-width:2}
.gridlab{font:10px var(--mono);fill:var(--muted)}
/* paint-order:stroke puts a surface-coloured halo behind glyphs so labels stay readable
   where they cross county lines. */
.citylab{font:11px var(--sans);fill:var(--muted);pointer-events:none;
         paint-order:stroke;stroke:var(--sheet);stroke-width:3.5px;stroke-linejoin:round}
.citynum{font-family:var(--mono);font-weight:600;fill:var(--ink)}
.cityhire{font-family:var(--mono);font-weight:700;fill:var(--consult)}
.offlab{font:600 11px var(--sans);fill:var(--office);pointer-events:none;
        paint-order:stroke;stroke:var(--sheet);stroke-width:3.5px;stroke-linejoin:round}
.ctylab{font:9.5px var(--sans);fill:var(--muted);opacity:.9;pointer-events:none;
        paint-order:stroke;stroke:var(--sheet);stroke-width:2.6px;stroke-linejoin:round}
.scale{stroke:var(--ink);stroke-width:1.1;fill:none}
.scalelab{font:9.5px var(--mono);fill:var(--muted)}
#tt{position:absolute;display:none;pointer-events:none;background:var(--ttbg);border:1px solid var(--hair);
    padding:8px 11px;font:12px/1.5 var(--sans);max-width:240px;box-shadow:0 2px 10px rgba(0,0,0,.10);z-index:5}
#tt .n{font-weight:600;font-size:13px}
#tt .d{font-family:var(--mono);color:var(--muted)}
h2{font:400 19px var(--serif);border-top:1px solid var(--hair);padding-top:18px;margin:22px 0 10px}
h2 span{font:11px var(--mono);color:var(--muted);letter-spacing:.08em;margin-left:10px}
table{width:100%;border-collapse:collapse;font:12.5px var(--sans)}
th{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
   border-bottom:1.5px solid var(--ink);padding:6px 8px;text-align:left}
th.num,td.num{text-align:right;font-family:var(--mono)}
th button{all:unset;cursor:pointer;letter-spacing:inherit}
th button:hover,th button:focus-visible{color:var(--ink);outline:1px dotted var(--gold);outline-offset:2px}
td{border-bottom:1px solid var(--hair);padding:5px 8px}
tr:hover td{background:color-mix(in srgb,var(--gold) 7%,transparent)}
tfoot td{border-bottom:none;border-top:1.5px solid var(--ink);font-weight:600}
.notes{font:12px/1.65 var(--sans);color:var(--muted);margin-top:20px;border-top:1px solid var(--hair);padding-top:14px}
.notes b{color:var(--ink);font-weight:600}
.notes p{margin:0 0 9px}
.foot{font:10.5px var(--mono);color:var(--muted);letter-spacing:.06em;margin-top:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:640px){.sheet{padding:22px 16px;margin:10px}.tblock{flex-direction:column;align-items:flex-start}.meta{text-align:left}}
@media print{body{background:#fff}.sheet{border:none;margin:0;max-width:none}}
</style>
</head>
<body>
<div class="sheet">
  <div class="tblock">
    <div>
      <p class="eyebrow" id="m-client"></p>
      <h1 id="m-title"></h1>
      <p class="sub" id="m-sub"></p>
    </div>
    <div class="meta">
      <div>PERIOD<b id="m-period"></b></div>
      <div>WINDOW<b id="m-window"></b></div>
      <div>SNAPSHOT<b id="m-snap"></b></div>
      <div>PREPARED BY<b>Rocket Clicks</b></div>
    </div>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="lab">Leads on map</div><div class="val" id="k-tot"></div></div>
    <div class="kpi"><div class="lab" id="k-mlab"></div><div class="val" id="k-con"></div></div>
    <div class="kpi"><div class="lab">Origin points</div><div class="val" id="k-pts"></div></div>
    <div class="kpi" id="k-hbox"><div class="lab">Hired</div><div class="val na">Not tracked</div></div>
  </div>

  <div class="legend" id="legend"></div>

  <div id="mapwrap">
    <svg id="map" viewBox="0 0 960 750" role="img" aria-labelledby="map-desc"></svg>
    <div class="zoomctl">
      <button id="zout" type="button" title="Zoom out (minus key)" aria-label="Zoom out">&minus;</button>
      <button id="zin" type="button" title="Zoom in (plus key)" aria-label="Zoom in">+</button>
      <button id="zreset" type="button" class="wide" title="Reset view (0 key)">Reset</button>
      <span id="zlevel" aria-live="polite">1.0&times;</span>
    </div>
    <p id="map-desc" hidden></p>
    <div id="tt"></div>
  </div>

  <p class="maphint">
    <span>Scroll or pinch to zoom &middot; drag to pan &middot; double&#8209;click to zoom in &middot;
      arrow keys and &plus;&thinsp;/&thinsp;&minus;&thinsp;/&thinsp;0 when focused</span>
    <span id="hint-precision"></span>
  </p>

  <h2>Schedule of origins <span id="h-tx"></span></h2>
  <table id="tbl">
    <thead><tr>
      <th><button data-k="n">Origin</button></th>
      <th><button data-k="lvl">Precision</button></th>
      <th class="num"><button data-k="t">Leads</button></th>
      <th class="num"><button data-k="c" id="th-metric"></button></th>
      <th class="num"><button data-k="r">Rate</button></th>
    </tr></thead>
    <tbody></tbody>
    <tfoot></tfoot>
  </table>

  <div id="offblock" hidden>
    <h2>Offices</h2>
    <table id="tbl3">
      <thead><tr><th>Office</th><th>Address</th><th>County</th><th class="num">City leads</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="notes" id="notes"></div>

  <div class="foot"><span id="f-left"></span><span>LEAD ORIGIN MAP &middot; SHEET 1 OF 1</span></div>
</div>

   Standard parallels are set at the 25th/75th percentile of the state's latitude span

   any state without hand tuning.                                                     */
const RAD = Math.PI / 180;
let lo0 = 999, la0 = 999, lo1 = -999, la1 = -999;
function eachC(g, fn){
  const polys = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
  for (const poly of polys) for (const ring of poly) for (const c of ring) fn(c);

  if (c[0] < lo0) lo0 = c[0]; if (c[0] > lo1) lo1 = c[0];

const rho0 = Math.sqrt(CA - 2 * nA * Math.sin(P0)) / nA;
function raw(lon, lat){
  const th = nA * (lon * RAD - L0);
  const rho = Math.sqrt(Math.max(0, CA - 2 * nA * Math.sin(lat * RAD))) / nA;
  return [rho * Math.sin(th), rho * Math.cos(th) - rho0];

function measure(list){
  for (const o of list) if (!o.w){
    try { o.w = o.txt.getBBox().width || o.txt.textContent.length * 6; }
    catch (e) { o.w = o.txt.textContent.length * 6; }
  }
}

function place(){
  measure(OFF); measure(CITY);
  const taken = [];
  const put = (o, forced) => {
    const sx = tx + k * o.px, sy = ty + k * o.py;
    if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40){ o.el.setAttribute("display", "none"); return; }
    for (const [dx, dy, an] of CAND(o.r)){
      const bx = an === "end" ? sx + dx - o.w : an === "middle" ? sx + dx - o.w / 2 : sx + dx;
      const rect = [bx - 1, sy + dy - 9, o.w + 2, 12];
      if (rect[0] < 2 || rect[0] + rect[2] > W - 2) continue;
      if (taken.some(r => hit(r, rect))) continue;
      o.txt.setAttribute("x", dx); o.txt.setAttribute("y", dy);
      o.txt.setAttribute("text-anchor", an);
      o.el.setAttribute("display", "inline");
      taken.push(rect); return;
    }
    o.el.setAttribute("display", forced ? "inline" : "none");
  };
  // offices first (they are the annotation the reader is looking for), then by volume
  OFF.forEach(o => put(o, true));
  CITY.forEach(o => o.hide ? o.el.setAttribute("display", "none") : put(o, false));
  if (k >= 3){ CTY.forEach(o => { measure([o]); put(o, false); }); }
  else CTY.forEach(o => o.el.setAttribute("display", "none"));
}

function apply(){
  const minTx = W - W * k, minTy = H - H * k;
  tx = Math.min(0, Math.max(minTx, tx));
  ty = Math.min(0, Math.max(minTy, ty));
  gVP.setAttribute("transform", `translate(${tx.toFixed(2)},${ty.toFixed(2)}) scale(${k.toFixed(4)})`);
  const inv = 1 / k;
  for (const s of SCALED) s.el.setAttribute("transform", `translate(${s.px},${s.py}) scale(${inv})`);
  place();
  drawScale(k);
  document.getElementById("zlevel").textContent = k.toFixed(1) + "×";
  document.getElementById("zreset").disabled = (k === 1);
}

function toVB(ev){
  const r = svg.getBoundingClientRect();
  return [(ev.clientX - r.left) / r.width * W, (ev.clientY - r.top) / r.height * H];
}
function zoomAt(vx, vy, f){
  const k2 = Math.min(MAXK, Math.max(MINK, k * f));
  if (k2 === k) return;
  tx = vx - (vx - tx) * (k2 / k); ty = vy - (vy - ty) * (k2 / k); k = k2; apply();
}
svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const [vx, vy] = toVB(ev);
  zoomAt(vx, vy, Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.012 : 0.0022)));
}, {passive: false});
svg.addEventListener("dblclick", ev => { ev.preventDefault(); const v = toVB(ev); zoomAt(v[0], v[1], 1.8); });

let px0 = 0, py0 = 0;
svg.addEventListener("pointerdown", ev => {
  if (ev.button !== 0) return;
  dragging = true; px0 = ev.clientX; py0 = ev.clientY;
  svg.setPointerCapture(ev.pointerId); svg.classList.add("grabbing");
});
svg.addEventListener("pointermove", ev => {
  if (!dragging) return;
  const r = svg.getBoundingClientRect();
  tx += (ev.clientX - px0) / r.width * W; ty += (ev.clientY - py0) / r.height * H;
  px0 = ev.clientX; py0 = ev.clientY; apply();
});
function endDrag(ev){
  if (!dragging) return;
  dragging = false; svg.classList.remove("grabbing");
  try { svg.releasePointerCapture(ev.pointerId); } catch (e) {}
}
svg.addEventListener("pointerup", endDrag);
svg.addEventListener("pointercancel", endDrag);
document.getElementById("zin").addEventListener("click", () => zoomAt(W / 2, H / 2, 1.6));
document.getElementById("zout").addEventListener("click", () => zoomAt(W / 2, H / 2, 1 / 1.6));
document.getElementById("zreset").addEventListener("click", () => { k = 1; tx = 0; ty = 0; apply(); });
svg.setAttribute("tabindex", "0");
svg.addEventListener("keydown", ev => {
  const s = 40 / k;
  const mv = {ArrowLeft: [s, 0], ArrowRight: [-s, 0], ArrowUp: [0, s], ArrowDown: [0, -s]};
  if (mv[ev.key]){ ev.preventDefault(); tx += mv[ev.key][0]; ty += mv[ev.key][1]; apply(); }
  else if (ev.key === "+" || ev.key === "=") { ev.preventDefault(); zoomAt(W / 2, H / 2, 1.6); }
  else if (ev.key === "-" || ev.key === "_") { ev.preventDefault(); zoomAt(W / 2, H / 2, 1 / 1.6); }
  else if (ev.key === "0") { ev.preventDefault(); k = 1; tx = 0; ty = 0; apply(); }
});
function flyTo(lon, lat, level){
  const p = proj(lon, lat);
  k = level; tx = W / 2 - p[0] * k; ty = H / 2 - p[1] * k; apply();
  wrap.scrollIntoView({behavior: "smooth", block: "center"});
}
window.mapFlyTo = flyTo;

/* ---- Header, legend, tables, notes ------------------------------------------------ */
const rate = M.plotted ? (M.conversions / M.plotted * 100).toFixed(1) : "0.0";
document.title = M.client + " | " + M.state + " Lead Origins | Last " + M.window_days + " Days";
document.getElementById("m-client").textContent = M.client;
document.getElementById("m-title").textContent = M.state + " Lead Origins";
document.getElementById("m-sub").textContent =
  "Where the last " + M.window_days + " days of leads came from, and which of them reached " +
  METRIC + ". Hover any point for detail." +
  ((D.offices || []).length ? " Offices marked in gold." : "");
document.getElementById("m-period").textContent = M.period;
document.getElementById("m-window").textContent = M.window_days + " days";
document.getElementById("m-snap").textContent = M.snapshot;
document.getElementById("k-tot").textContent = M.plotted;
document.getElementById("k-mlab").textContent = M.metric_label;
document.getElementById("k-con").innerHTML = M.conversions + ' <small>' + rate + '%</small>';
document.getElementById("k-con").classList.add("hi");
document.getElementById("k-pts").innerHTML = M.origin_points + ' <small>cities</small>';
document.getElementById("th-metric").textContent = M.metric_label;
document.getElementById("h-tx").textContent = M.plotted + " leads · " + M.origin_points + " origins";
document.getElementById("f-left").textContent =
  (M.client + " · " + M.state + " · LAST " + M.window_days + " DAYS").toUpperCase();
document.getElementById("hint-precision").textContent =
  "Zooming reveals more city and county names — it does not add precision beyond the city";
// The Hired tile only appears when it is genuinely not tracked; otherwise it IS the metric.
if (M.hired_tracked) document.getElementById("k-hbox").remove();

document.getElementById("legend").innerHTML =
  '<label class="tg" id="tg-leads-lab" title="Show or hide the lead layer"><input type="checkbox" id="tg-leads" checked>' +
    '<span class="sw sw-lead"></span><span id="tg-leads-txt">Leads (bubble area)</span></label>' +
  '<label class="tg" id="tg-hires-lab" title="Show or hide the ' + METRIC + ' layer"><input type="checkbox" id="tg-hires" checked>' +
    '<span class="sw sw-con"></span><span id="tg-hires-txt">' + M.metric_label + ' (inner dot; count in label)</span></label>' +
  ((D.offices || []).length ? '<span><span class="sw sw-off"></span>Office location</span>' : '') +
  '<span><span class="sw sw-cty"></span>County boundaries</span>' +
  '<span class="tghint">Switches show or hide a layer; the table follows.</span>';

document.getElementById("map-desc").textContent =
  "Map of " + M.state + " with all " + GEO.counties.features.length + " county boundaries. " +
  "Proportional bubbles mark each of the " + M.origin_points + " cities where leads " +
  "originated in the last " + M.window_days + " days; the inner dot and the count in each label show how many reached " +
  METRIC + ". " + (pts.length ? pts[0].n + " leads with " + pts[0].t + " of " + M.plotted +
  " leads. " : "") + "The map can be zoomed and panned.";

const rows = pts.map(d => ({n: d.n, lvl: d.k ? "Area approx." : "City (exchange)", t: d.t, c: d.c,
                            r: d.t >= MIN_N ? d.c / d.t : -1, lon: d.lon, lat: d.lat}));
let sortK = "t", sortDir = -1;
let layerMode = "both";
const tbody = document.querySelector("#tbl tbody");
function render(){
  rows.sort((a, b) => {
    const va = a[sortK], vb = b[sortK];
    return (typeof va === "string" ? va.localeCompare(vb) : va - vb) * sortDir || b.t - a.t;
  });
  const list = layerMode === "hires" ? rows.filter(r => r.c > 0) : rows;
  tbody.innerHTML = list.map(r =>
    "<tr class='clickable' data-lon='" + r.lon + "' data-lat='" + r.lat + "' title='Zoom to " +
    r.n + "'><td>" + r.n + "</td><td>" + r.lvl + "</td><td class='num'>" + r.t +
    "</td><td class='num" + (r.c > 0 ? " hi" : "") + "'>" + r.c + "</td><td class='num'>" + rateCell(r.c, r.t) +
    "</td></tr>").join("");
}
tbody.addEventListener("click", ev => {
  const tr = ev.target.closest("tr.clickable"); if (!tr) return;
  flyTo(parseFloat(tr.dataset.lon), parseFloat(tr.dataset.lat), 6);
});
document.querySelector("#tbl tfoot").innerHTML =
  "<tr><td>" + M.state + " total</td><td></td><td class='num'>" + M.plotted +
  "</td><td class='num hi'>" + M.conversions + "</td><td class='num'>" + rate + "%</td></tr>";
document.querySelectorAll("#tbl th button").forEach(b => {
  b.addEventListener("click", () => {
    const kk = b.dataset.k;
    sortDir = (kk === sortK) ? -sortDir : (kk === "n" || kk === "lvl" ? 1 : -1);
    sortK = kk; render();
  });
});
render();

/* ---- Layer switches: leads and conversions can each be shown alone ------------------- */
function applyLayers(){
  const showL = document.getElementById("tg-leads").checked;
  const showH = document.getElementById("tg-hires").checked;
  layerMode = showL && showH ? "both" : showL ? "leads" : showH ? "hires" : "none";
  document.getElementById("tg-leads-lab").classList.toggle("off", !showL);
  document.getElementById("tg-hires-lab").classList.toggle("off", !showH);
  document.getElementById("tg-hires-txt").textContent = M.metric_label +
    (layerMode === "hires" ? " (bubble area)" : " (inner dot; count in label)");
  pts.forEach(d => {
    const vis = layerMode === "both" || layerMode === "leads" || (layerMode === "hires" && d.c > 0);
    d._g.setAttribute("display", vis ? "inline" : "none");
    d._city.hide = !vis;
    d._city.w = 0;
    d._city.el.setAttribute("display", vis ? "inline" : "none");
    if (!vis) return;
    if (layerMode === "hires"){
      d._oc.setAttribute("display", "none");
      d._ic.setAttribute("display", "inline"); d._ic.setAttribute("r", RH(d.c)); d._ic.classList.add("solo");
      d._hit.setAttribute("r", Math.max(RH(d.c), 11));
      d._city.r = RH(d.c);
      d._num.textContent = d.c + " " + SHORT; d._num.setAttribute("class", "citynum cityhire");
      d._sep.textContent = ""; d._hire.textContent = "";
    } else {
      d._oc.setAttribute("display", "inline");
      if (d._ic){ d._ic.setAttribute("display", layerMode === "both" ? "inline" : "none");
                  d._ic.setAttribute("r", icR(d)); d._ic.classList.remove("solo"); }
      d._hit.setAttribute("r", Math.max(R(d.t), 11));
      d._city.r = R(d.t);
      d._num.textContent = d.t; d._num.setAttribute("class", "citynum");
      const both = layerMode === "both" && d.c > 0;
      d._sep.textContent = both ? " \u00b7 " : ""; d._hire.textContent = both ? d.c + " " + SHORT : "";
    }
  });
  CITY.sort((a, b) => layerMode === "hires" ? (b.c - a.c || b.t - a.t) : (b.t - a.t));
  place();
  document.getElementById("tbl").classList.toggle("nohire", !showH);
  if (layerMode === "hires"){ sortK = "c"; sortDir = -1; }
  else if (sortK === "c"){ sortK = "t"; sortDir = -1; }
  render();
  const withC = pts.filter(p => p.c > 0).length;
  document.getElementById("h-tx").textContent = layerMode === "hires"
    ? M.conversions + " " + NOUN + " \u00b7 " + withC + " origins with " + NOUN
    : M.plotted + " leads \u00b7 " + M.origin_points + " origins";
}
document.getElementById("tg-leads").addEventListener("change", applyLayers);
document.getElementById("tg-hires").addEventListener("change", applyLayers);
if (!M.metric_status) document.getElementById("tg-hires-lab").hidden = true;
window.setLayers = (leads, hires) => {   // for scripted checks
  document.getElementById("tg-leads").checked = !!leads;
  document.getElementById("tg-hires").checked = !!hires; applyLayers();
};

if ((D.offices || []).length){
  document.getElementById("offblock").hidden = false;
  const byName = {}; pts.forEach(p => byName[p.n] = p);
  document.querySelector("#tbl3 tbody").innerHTML = D.offices.map(o =>
    "<tr><td>" + o.name + "</td><td>" + (o.addr || "") + "</td><td>" + (o.county || "—") +
    "</td><td class='num'>" + ((byName[o.name] || {}).t ?? "—") + "</td></tr>").join("");
}

const N = [];
N.push("<b>Window.</b> The last " + M.window_days + " days, " + M.period +
  " inclusive, by lead creation date. " + M.in_window + " deduplicated leads fall inside it." +
  (M.last_event ? " The client's most recent recorded event is " + M.last_event +
   "; any gap to the window end is pipeline lag, not a drop in volume." : ""));
N.push("<b>" + M.state + " only.</b> " + M.plotted + " of " + M.in_window +
  " leads carry a " + M.state_ab + " number and are plotted. Excluded: " + M.dropped_oos +
  " out-of-state, " + M.dropped_nophone + " with no usable phone, " + M.dropped_unresolved +
  " whose exchange could not be resolved. Totals describe leads carrying a " + M.state_ab +
  " number, not the whole pipeline." +
  // Out-of-state numbers that still converted. Only draw the "they are really in-state
  // clients" conclusion when the out-of-state rate is comparable to the in-state rate on at
  // least MIN_N conversions; one hire off 62 numbers (Ireland, 2026-09-23) proves nothing.
  (M.dropped_oos_conv > 0 && M.metric_status
    ? " " + M.dropped_oos_conv + " of the " + M.dropped_oos + " out-of-state leads still reached " +
      METRIC + (M.dropped_oos_conv >= MIN_N ? " (" + rateCell(M.dropped_oos_conv, M.dropped_oos) + ")" : "") + "." +
      (M.dropped_oos_conv >= MIN_N && M.plotted > 0 && M.conversions > 0 &&
       M.dropped_oos_conv / M.dropped_oos >= 0.75 * (M.conversions / M.plotted)
        ? " That is comparable to the " + M.state_ab + " rate, which suggests many of them are " + M.state +
          " residents whose mobile number was issued elsewhere; the " + M.state +
          " book is probably larger than the plotted total."
        : "")
    : ""));
N.push("<b>Geocoding.</b> Each lead's telephone exchange (NPA-NXX) was resolved to its telco " +
  "rate-center city and coordinates via the public localcallingguide.com prefix registry. " +
  "Billing-zone suffixes that are not places were folded into their city, and directional zones " +
  "such as \"Tampa North\" into their city, so " +
  "\"Houston Suburban\" counts as Houston. A rate center is where the <i>number</i> was " +
  "issued, not where the person lives: a mobile line follows its owner, so a share of these " +
  "points are approximately rather than exactly right." +
  (M.zip_source ? " <b>Note:</b> this client also has lead-level zip in <span " +
   "style='font-family:var(--mono)'>" + M.zip_source.dataset + ".call_data</span> (" +
   M.zip_source.column + "), which would geocode more precisely than the exchange." : ""));
N.push("<b>Rates below " + MIN_N + " leads are withheld.</b> " +
  pts.filter(p => p.t < MIN_N).length + " of the " + M.origin_points +
  " origins hold fewer than " + MIN_N + " leads; they show counts but a dash for rate, because " +
  "\"67%\" off three leads invites exactly the wrong read. Rates on fewer than 50 leads are " +
  "shown as whole percents.");
if (M.hired_tracked){
  N.push("<b>" + M.metric_label + ".</b> " + M.conversions + " of " + M.plotted + " leads (" +
    rate + "%) reached " + METRIC + ", the deepest stage this client records. Counts are to date: " +
    "leads from the most recent months have had less time to sign, so recent-heavy origins read low.");
} else {
  N.push("<b>Hired is not tracked.</b> This client has no Funded Agreement records at any " +
    "point, so no hire rate can be computed and the inner dot shows " + METRIC +
    " instead — the deepest stage actually recorded. <b>A blank Hired figure means " +
    "\"not measured,\" not \"nobody signed.\"</b>");
}
N.push("<b>Source.</b> <span style='font-family:var(--mono)'>all_clients_offline_conversion." +
  "all_firms_offline_conversion</span>, SterlingX_Client_ID <span style='font-family:var(--mono)'>" +
  M.client_id.slice(0, 8) + "…</span>, refreshed daily; snapshot " + M.snapshot +
  ". Deduplicated on normalized phone and email with firm-internal notification records " +
  "removed. County geometry from the US Census county file, state outline dissolved from it." +
  // Origin-platform mix over the whole in-window cohort. A source that begins mid-window or
  // converts at a very different rate can dominate a blended rate or a month-over-month change.
  ((M.platforms || []).length > 1
    ? " Leads in the window by origin platform: " + M.platforms.map(p =>
        p.name + " " + p.t + (M.metric_status ? " (" + p.c + " " + METRIC +
        (p.t >= MIN_N ? ", " + rateCell(p.c, p.t) : "") + ")" : "") +
        (p.first && M.date_from && p.first > M.date_from.slice(0, 7) ? ", first seen " + p.first : "")
      ).join("; ") + ". A blended " + METRIC + " rate mixes these populations; read city rates with that in mind."
    : ""));
document.getElementById("notes").innerHTML = N.map(p => "<p>" + p + "</p>").join("");

apply();
</script>
