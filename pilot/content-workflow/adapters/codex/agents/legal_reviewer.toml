## Rechecks

On a recheck you receive the revised draft and your prior findings. For each prior finding
re-read the revised passage and set `resolution.status` to `fixed-verified` only if the
revised text now satisfies the requested correction against the authority; copy the revised
passage into `resolution.corrected_text` (the recorder rejects text that is not in the draft)
and record the authority you re-read. Otherwise leave it `open` with a note. Only you may
